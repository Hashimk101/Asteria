<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#102d4d"/>
      <stop offset=".62" stop-color="#061326"/>
      <stop offset="1" stop-color="#020611"/>
    </radialGradient>
    <radialGradient id="rock" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#8e7b65"/>
      <stop offset=".28" stop-color="#4c443d"/>
      <stop offset=".65" stop-color="#211f20"/>
      <stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#35e8ff"/>
      <stop offset=".5" stop-color="#1470c9"/>
      <stop offset="1" stop-color="#ff9b32"/>
    </linearGradient>
    <filter id="glowC">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowO">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="256" cy="256" r="205"/></clipPath>
  </defs>

  <!-- Deep-space core -->
  <circle cx="256" cy="256" r="238" fill="url(#bg)"/>
  <g clip-path="url(#disc)" opacity=".9">
    <g fill="#fff">
      <circle cx="83" cy="113" r="1.5"/><circle cx="119" cy="72" r="1"/>
      <circle cx="178" cy="101" r="1.2"/><circle cx="390" cy="88" r="1.4"/>
      <circle cx="433" cy="155" r="1"/><circle cx="82" cy="330" r="1.2"/>
      <circle cx="137" cy="405" r="1"/><circle cx="366" cy="407" r="1.3"/>
      <circle cx="425" cy="342" r="1.5"/><circle cx="333" cy="58" r="1"/>
      <circle cx="58" cy="247" r="1.2"/><circle cx="463" cy="250" r="1"/>
    </g>
  </g>

  <!-- Outer instrument bezel -->
  <circle cx="256" cy="256" r="231" fill="none" stroke="#07101d" stroke-width="18"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="url(#edge)" stroke-width="5"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#159edc" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#ff9b32" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 19"/>

  <!-- Orbital measurement paths -->
  <g fill="none" stroke-linecap="round" filter="url(#glowC)">
    <ellipse cx="256" cy="256" rx="177" ry="72" transform="rotate(20 256 256)"
             stroke="#32e8ff" stroke-width="3"/>
    <ellipse cx="256" cy="256" rx="185" ry="96" transform="rotate(-28 256 256)"
             stroke="#ff9b32" stroke-width="2.5"/>
    <ellipse cx="256" cy="256" rx="155" ry="155"
             stroke="#24a8ef" stroke-width="1.5" stroke-dasharray="9 10"/>
  </g>

  <!-- Measurement crosshair -->
  <g stroke="#36eaff" stroke-width="1.5" opacity=".75">
    <path d="M256 48v416M48 256h416"/>
    <path d="M246 256h20M256 246v20"/>
  </g>
  <circle cx="256" cy="256" r="8" fill="#061321" stroke="#45efff" stroke-width="3"/>

  <!-- Asteroid -->
  <path d="M151 228
           C151 198 172 177 193 162
           C216 145 243 137 272 143
           C300 130 331 145 350 164
           C375 179 391 207 387 232
           C403 257 388 287 373 303
           C365 331 338 347 313 355
           C287 373 256 363 234 370
           C207 359 184 345 171 321
           C148 307 139 276 151 251
           C142 244 143 235 151 228Z"
        fill="url(#rock)" stroke="#b7c3ca" stroke-width="3"/>

  <!-- Asteroid facets -->
  <g fill="none" stroke-linecap="round">
    <path d="M181 220l46-44 44 19 42-18 35 47-27 40-51 14-38 42-45-31 12-39z"
          stroke="#8d8172" stroke-opacity=".65" stroke-width="4"/>
    <path d="M228 176l17 52-34 43M271 195l-26 33 38 31 43-39M245 280l-8 50M291 274l22 55"
          stroke="#554b43" stroke-width="5"/>
    <path d="M194 266l38-13 29 25-23 37M311 223l34 18-18 32-38-8"
          stroke="#a28b6c" stroke-opacity=".6" stroke-width="3"/>
  </g>

  <!-- Glowing mineral fissures -->
  <g fill="none" stroke="#ff8b22" stroke-linecap="round" filter="url(#glowO)">
    <path d="M191 218l29-18 18 20 24-9 19 25" stroke-width="5"/>
    <path d="M283 246l20-17 27 9 15-21" stroke-width="4"/>
    <path d="M226 305l22-15 20 11 23-21" stroke-width="4"/>
  </g>

  <!-- Orbit nodes -->
  <g fill="#071522" stroke="#42efff" stroke-width="3" filter="url(#glowC)">
    <circle cx="105" cy="228" r="7"/><circle cx="406" cy="309" r="7"/>
    <circle cx="365" cy="155" r="6"/>
  </g>

  <!-- Tiny Earth-like marker -->
  <g transform="translate(113 327)">
    <circle r="25" fill="#07111d" stroke="#35dfff" stroke-width="2"/>
    <path d="M-14-4c8-13 18-10 22-3l-5 7-8 1-5 9-8-5z" fill="#3b91c8"/>
    <path d="M5 10l10-6 5 8-8 8z" fill="#4f9b67"/>
  </g>

  <!-- App mark / targeting accent -->
  <g transform="translate(405 112)" filter="url(#glowC)">
    <circle r="15" fill="none" stroke="#36eaff" stroke-width="2"/>
    <path d="M0-25v10M0 15v10M-25 0h10M15 0h10" stroke="#36eaff" stroke-width="2"/>
    <circle r="4" fill="#ff9b32"/>
  </g>

  <!-- Subtle tick marks -->
  <g stroke="#36eaff" stroke-width="2" opacity=".8">
    <path d="M256 42v12M256 458v12M42 256h12M458 256h12"/>
    <path d="M105 105l8 8M399 105l-8 8M105 407l8-8M407 407l-8-8"/>
  </g>
</svg>